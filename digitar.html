<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela - Retira Azul Logística</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body { 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 25px 15px;
            background: #1e92ce linear-gradient(180deg, #1b8ecb 0%, #2299d6 50%, #2da6e3 100%);
            background-attachment: fixed;
        }

        .header-logo {
            margin-bottom: 20px;
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        .logo-cover {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 30, 60, 0.25);
            display: block;
            margin: 0 auto;
        }

        .tela { 
            background: #ffffff; 
            padding: 30px 35px; 
            border-radius: 18px; 
            box-shadow: 0 16px 36px rgba(0, 35, 70, 0.22); 
            width: 100%;
            max-width: 900px;
        }

        .campo-grupo { 
            margin-bottom: 20px; 
            text-align: left; 
        }

        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #1e293b; 
            font-size: 14px; 
        }

        .linha-cliente-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .label-cliente {
            font-weight: bold;
            color: #0f172a;
            font-size: 15px;
            white-space: nowrap;
        }

        .input-cliente-box {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .input-cliente-box input {
            width: 100%;
            border: 2px solid #c02626;
            border-radius: 8px;
            padding: 10px 38px 10px 14px;
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            outline: none;
            background: #ffffff;
        }

        .btn-clear-cliente {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #c02626;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .separador {
            height: 1px;
            background-color: #e2e8f0;
            margin: 18px 0;
        }

        .linha-senha { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 10px; 
            width: 100%; 
        }

        input, select { 
            padding: 10px 8px; 
            font-size: 13px; 
            border: 1.5px solid #1e92ce; 
            border-radius: 8px; 
            outline: none;
            background-color: #fcfdfe;
            color: #334155;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: #0d47a1;
            box-shadow: 0 0 0 3px rgba(30, 146, 206, 0.2);
        }

        .input-senha { flex: 1.5; min-width: 0; } 
        .select-tipo { flex: 1.3; min-width: 0; }
        .input-volume { flex: 0.9; text-align: center; min-width: 0; } 
        .input-peso { flex: 1; text-align: center; min-width: 0; }
        .select-unidade { flex: 0.9; min-width: 0; }
        .select-status { flex: 1.2; min-width: 0; }
        .input-obs { flex: 1.2; min-width: 0; }

        .btn-remover { 
            background: #dc2626; 
            color: white; 
            border: none; 
            padding: 10px 14px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 12px; 
            cursor: pointer; 
            transition: background 0.2s; 
            white-space: nowrap; 
        }
        .btn-remover:hover { background: #b91c1c; }

        .rodape-botoes {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-secundario { 
            flex: 1; 
            background: #1e92ce; 
            color: white; 
            border: none; 
            padding: 13px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
            transition: background 0.2s; 
        }
        .btn-secundario:hover { background: #167ab0; }

        button#btn-chamar { 
            flex: 1; 
            padding: 13px; 
            background: #2e7d32; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button#btn-chamar:hover { background: #256628; }
    </style>
</head>
<body>

    <div class="header-logo">
        <img class="logo-cover" src="azul_cargo_cover.jpg" alt="Azul Logística">
    </div>

    <div class="tela">
        <div class="campo-grupo">
            <div class="linha-cliente-container">
                <span class="label-cliente">Cliente:</span>
                <div class="input-cliente-box">
                    <input type="text" id="campo-nome" placeholder="Ex: M2A">
                    <button type="button" class="btn-clear-cliente" id="btn-limpar-cliente" title="Limpar campo">✕</button>
                </div>
            </div>
        </div>

        <div class="separador"></div>

        <div class="campo-grupo">
            <label>Especificações por CTE'S (AWB | Tipo | Vol. | Peso | Unid. | Status | OBS):</label>
            <div id="container-senhas">
                <div class="linha-senha">
                    <input type="tel" pattern="[0-9]*" class="input-senha" placeholder="Nº CTE'S">
                    <select class="select-tipo">
                        <option value="Normal">Normal</option>
                        <option value="Premium">Premium</option>
                        <option value="Perecível">Perecível</option>
                        <option value="DGR">DGR (Perigosa)</option>
                    </select>
                    <input type="number" class="input-volume" placeholder="Vol." min="1">
                    <input type="number" class="input-peso" placeholder="Peso" step="0.01">
                    <select class="select-unidade">
                        <option value="KG">KG</option>
                        <option value="G">G</option>
                    </select>
                    <select class="select-status">
                        <option value="Completo">Completo</option>
                        <option value="Parcial">Parcial</option>
                    </select>
                    <input type="text" class="input-obs" placeholder="OBS ( / )">
                    <button type="button" class="btn-remover" style="visibility: hidden;">REMOVE</button>
                </div>
            </div>
        </div>

        <div class="rodape-botoes">
            <button id="btn-add-campo" class="btn-secundario">+ Adicionar mais CTE'S</button>
            <button id="btn-chamar">CHAMAR NO PAINEL</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const campoNome = document.getElementById('campo-nome');
        const btnLimparCliente = document.getElementById('btn-limpar-cliente');
        const containerSenhas = document.getElementById('container-senhas');
        const btnAddCampo = document.getElementById('btn-add-campo');
        const btnChamar = document.getElementById('btn-chamar');

        // Botão X: limpa e foca no campo do cliente
        btnLimparCliente.addEventListener('click', () => {
            campoNome.value = '';
            campoNome.focus();
        });

        function aplicarFiltroObs(input) {
            input.addEventListener('input', () => {
                input.value = input.value.replace(/[^0-9/]/g, '');
            });
        }

        function aplicarFiltroNumerico(input) {
            input.addEventListener('input', () => {
                input.value = input.value.replace(/[^0-9]/g, '');
            });
        }

        aplicarFiltroNumerico(containerSenhas.querySelector('.input-senha'));
        aplicarFiltroObs(containerSenhas.querySelector('.input-obs'));

        const estruturaLinhaHTML = `
            <input type="tel" pattern="[0-9]*" class="input-senha" placeholder="Nº CTE'S">
            <select class="select-tipo">
                <option value="Normal">Normal</option>
                <option value="Premium">Premium</option>
                <option value="Perecível">Perecível</option>
                <option value="DGR">DGR (Perigosa)</option>
            </select>
            <input type="number" class="input-volume" placeholder="Vol." min="1">
            <input type="number" class="input-peso" placeholder="Peso" step="0.01">
            <select class="select-unidade">
                <option value="KG">KG</option>
                <option value="G">G</option>
            </select>
            <select class="select-status">
                <option value="Completo">Completo</option>
                <option value="Parcial">Parcial</option>
            </select>
            <input type="text" class="input-obs" placeholder="OBS ( / )">
            <button type="button" class="btn-remover">REMOVE</button>
        `;

        function adicionarNovaLinha() {
            const divLinha = document.createElement('div');
            divLinha.className = 'linha-senha';
            divLinha.innerHTML = estruturaLinhaHTML;

            aplicarFiltroNumerico(divLinha.querySelector('.input-senha'));
            aplicarFiltroObs(divLinha.querySelector('.input-obs'));

            divLinha.querySelector('.btn-remover').addEventListener('click', () => { divLinha.remove(); });
            containerSenhas.appendChild(divLinha);
            divLinha.querySelector('.input-senha').focus();
        }

        // Adiciona nova linha através do botão inferior
        btnAddCampo.addEventListener('click', adicionarNovaLinha);

        function limparFormulario() {
            campoNome.value = '';

            const todasAsLinhas = containerSenhas.querySelectorAll('.linha-senha');
            for (let i = 1; i < todasAsLinhas.length; i++) {
                todasAsLinhas[i].remove();
            }

            const primeiraLinha = containerSenhas.querySelector('.linha-senha');
            if (primeiraLinha) {
                primeiraLinha.querySelector('.input-senha').value = '';
                primeiraLinha.querySelector('.select-tipo').value = 'Normal';
                primeiraLinha.querySelector('.input-volume').value = '';
                primeiraLinha.querySelector('.input-peso').value = '';
                primeiraLinha.querySelector('.select-unidade').value = 'KG';
                primeiraLinha.querySelector('.select-status').value = 'Completo';
                primeiraLinha.querySelector('.input-obs').value = '';
            }

            campoNome.focus();
        }

        btnChamar.addEventListener('click', () => {
            const todasAsLinhas = document.querySelectorAll('.linha-senha');
            const listaItensCarga = [];
            
            let totalVolumesGeral = 0;
            let totalPesoKG = 0;

            todasAsLinhas.forEach(linha => {
                const inputSenha = linha.querySelector('.input-senha');
                const selectTipo = linha.querySelector('.select-tipo');
                const inputVolume = linha.querySelector('.input-volume');
                const inputPeso = linha.querySelector('.input-peso');
                const selectUnidade = linha.querySelector('.select-unidade');
                const selectStatus = linha.querySelector('.select-status');
                const inputObs = linha.querySelector('.input-obs');

                if (inputSenha && inputSenha.value.trim() !== "") {
                    const qtdVolume = inputVolume.value ? parseInt(inputVolume.value) : 1;
                    const valorPeso = inputPeso.value ? parseFloat(inputPeso.value) : 0;
                    const unidade = selectUnidade.value;

                    totalVolumesGeral += qtdVolume;
                    
                    if (unidade === "KG") { totalPesoKG += valorPeso; } 
                    else { totalPesoKG += (valorPeso / 1000); }

                    listaItensCarga.push({
                        senha: inputSenha.value.trim(),
                        tipo: selectTipo.value,
                        volume: qtdVolume,
                        pesoExibição: valorPeso ? `${valorPeso} ${unidade}` : "0 KG",
                        status: selectStatus.value,
                        obs: inputObs.value.trim() || "---"
                    });
                }
            });

            if (listaItensCarga.length === 0) {
                alert("Por favor, preencha pelo menos o número de 1 CTE!");
                return;
            }

            const dados = {
                nome: campoNome.value.trim(),
                volumesTotal: totalVolumesGeral,
                pesoTotalGeral: totalPesoKG > 0 ? `${totalPesoKG.toFixed(2)} KG` : "0.00 KG",
                itens: listaItensCarga
            };
            
            socket.emit('dados-digitados', dados);
            limparFormulario();
        });
    </script>
</body>
</html>
