<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tela - Visualizador Logístico</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
            transition: background 0.1s; 
            background: #1e92ce linear-gradient(180deg, #1b8ecb 0%, #2299d6 50%, #2da6e3 100%);
            background-attachment: fixed;
        }

        .header-logo {
            margin-bottom: 20px;
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        .logo-cover {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 30, 60, 0.25);
            display: block;
            margin: 0 auto;
        }

        .tela { 
            text-align: center; 
            width: 98vw; 
            max-width: 1850px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        
        .painel-principal { 
            background: rgba(30, 34, 43, 0.94); 
            padding: 20px 30px; 
            border-radius: 14px; 
            border: 2px solid #2ed573; 
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4); 
        }
        
        h2 { 
            color: #a4b0be; 
            font-size: 20px; 
            text-transform: uppercase; 
            margin: 0 0 10px 0; 
            letter-spacing: 1.5px; 
        }
        
        .label { 
            font-size: 14px; 
            color: #a4b0be; 
            text-transform: uppercase; 
            margin-bottom: 4px; 
            letter-spacing: 0.5px;
        }
        
        .valor { font-weight: bold; word-wrap: break-word; letter-spacing: 1px; }
        
        #txt-nome { 
            font-size: 38px; 
            color: #ffffff; 
            margin-bottom: 12px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .grid-detalhes { 
            display: flex; 
            justify-content: space-around; 
            background: rgba(0, 0, 0, 0.45); 
            padding: 10px 20px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .detalhe-item { flex: 1; text-align: center; }
        .detalhe-item .valor-mini { font-size: 24px; color: #3498db; font-weight: bold; }
        #txt-peso-total { color: #fffa65; }

        #container-visual-senhas { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 12px; 
            width: 100%; 
            margin-top: 8px;
        }
        
        .bloco-senha-completo { 
            background: rgba(255, 255, 255, 0.06); 
            padding: 12px 8px; 
            border-radius: 8px; 
            border: 1px solid rgba(46, 213, 115, 0.4); 
            text-align: center; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 4px;
        }
        
        .senha-codigo { 
            font-size: 42px; 
            color: #2ed573; 
            font-weight: bold; 
            line-height: 1em; 
            letter-spacing: -0.5px;
        }
        
        .senha-tipo-info { 
            font-size: 13px; 
            color: #54a0ff; 
            font-weight: bold; 
            text-transform: uppercase; 
            background: rgba(84, 160, 255, 0.12); 
            padding: 2px 6px; 
            border-radius: 4px; 
            display: inline-block; 
            margin: 0 auto;
        }
        
        .senha-detalhes-linha { font-size: 13px; color: #ced6e0; font-weight: 500; }
        
        .status-badge { 
            font-size: 11px; 
            font-weight: bold; 
            padding: 2px 6px; 
            border-radius: 3px; 
            text-transform: uppercase; 
            display: inline-block; 
        }
        .status-completo { background: rgba(46, 213, 115, 0.2); color: #2ed573; }
        .status-parcial { background: rgba(255, 159, 67, 0.2); color: #ff9f43; }
        
        .senha-obs-linha { 
            font-size: 12px; 
            color: #fffa65; 
            font-weight: bold; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
            padding-top: 4px; 
            word-break: break-all;
        }

        /* Seção Histórico */
        .secao-historico { 
            background: rgba(30, 34, 43, 0.95); 
            padding: 15px 25px; 
            border-radius: 12px; 
            text-align: left; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); 
        }

        .historico-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            flex-wrap: wrap;
        }

        .historico-topo h3 { 
            font-size: 14px; 
            color: #747d8c; 
            text-transform: uppercase; 
            margin: 0;
        }

        /* Barra de Busca no Histórico */
        .busca-historico-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .busca-historico-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 13px;
            padding: 4px;
            width: 220px;
        }

        .busca-historico-box input::placeholder {
            color: #a4b0be;
        }

        .btn-limpar-busca {
            background: none;
            border: none;
            color: #ff6b6b;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }
        
        #lista-historico { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            max-height: 220px; 
            overflow-y: auto; 
        }
        
        .historico-item { 
            display: flex; 
            justify-content: space-between; 
            background: rgba(255, 255, 255, 0.05); 
            padding: 8px 14px; 
            border-radius: 6px; 
            font-size: 14px; 
            color: #ced6e0; 
            align-items: center; 
            gap: 15px; 
            transition: background 0.3s;
        }

        .historico-item.destaque-busca {
            background: rgba(255, 234, 167, 0.25);
            border: 1px solid #f1c40f;
        }
        
        .hist-cliente-box { min-width: 250px; }
        .hist-nome { color: #ffffff; font-weight: bold; font-size: 15px; }
        .hist-info { color: #a4b0be; font-size: 12px; margin-left: 5px; }
        
        .hist-senhas { 
            color: #7bed9f; 
            font-weight: bold; 
            font-size: 13px; 
            flex: 1; 
            word-wrap: break-word; 
            text-align: left;
        }

        .hist-status-tag {
            font-size: 11px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .hist-status-verde { background: rgba(46, 213, 115, 0.25); color: #2ed573; border: 1px solid #2ed573; }
        .hist-status-amarelo { background: rgba(255, 234, 167, 0.25); color: #eccc68; border: 1px solid #eccc68; }
        .hist-status-vermelho { background: rgba(255, 71, 87, 0.25); color: #ff4757; border: 1px solid #ff4757; }

        .alerta-visual { background-image: none !important; background-color: #ff4757 !important; }
    </style>
</head>
<body>

    <div class="header-logo">
        <img class="logo-cover" src="azul_cargo_cover.jpg" alt="Azul Logística">
    </div>

    <div class="tela">
        <div class="painel-principal">
            <h2>Painel Informativo de CTE'S</h2>
            
            <div class="label">Cliente em Atendimento</div>
            <div id="txt-nome" class="valor">---</div>
            
            <div class="grid-detalhes">
                <div class="detalhe-item">
                    <div class="label">Soma Total de Volumes</div>
                    <div id="txt-volumes-total" class="valor-mini">---</div>
                </div>
                <div class="detalhe-item">
                    <div class="label">Soma Total de Pesos</div>
                    <div id="txt-peso-total" class="valor-mini">---</div>
                </div>
            </div>
            
            <div class="label">CTE'S em Atendimento</div>
            <div id="container-visual-senhas">
                <div class="bloco-senha-completo">
                    <div class="senha-codigo">---</div>
                </div>
            </div>
        </div>

        <div class="secao-historico">
            <div class="historico-topo">
                <h3>Últimas Chamadas Realizadas (Clique no status: 🟡 / 🟢 / 🔴)</h3>
                <div class="busca-historico-box">
                    <input type="text" id="campo-busca-historico" placeholder="🔍 Pesquisar CTE ou Cliente...">
                    <button type="button" class="btn-limpar-busca" id="btn-limpar-busca" title="Limpar pesquisa">✕</button>
                </div>
            </div>
            <div id="lista-historico"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const txtNome = document.getElementById('txt-nome');
        const txtVolumesTotal = document.getElementById('txt-volumes-total');
        const txtPesoTotal = document.getElementById('txt-peso-total');
        const containerVisualSenhas = document.getElementById('container-visual-senhas');
        const listaHistorico = document.getElementById('lista-historico');
        const campoBuscaHistorico = document.getElementById('campo-busca-historico');
        const btnLimparBusca = document.getElementById('btn-limpar-busca');

        let dadosAnteriores = null;

        function tocarBip() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const osc = context.createOscillator();
            const gain = context.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, context.currentTime);
            gain.gain.setValueAtTime(0.3, context.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, context.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(context.destination);
            osc.start();
            osc.stop(context.currentTime + 0.4);
        }

        function alternarStatusHistorico(tag) {
            if (tag.classList.contains('hist-status-amarelo')) {
                tag.className = 'hist-status-tag hist-status-verde';
                tag.innerHTML = '● Concluído';
            } else if (tag.classList.contains('hist-status-verde')) {
                tag.className = 'hist-status-tag hist-status-vermelho';
                tag.innerHTML = '● Pendente';
            } else {
                tag.className = 'hist-status-tag hist-status-amarelo';
                tag.innerHTML = '● Aguardando';
            }
        }

        // Filtro em tempo real no histórico
        function filtrarListaHistorico() {
            const termo = campoBuscaHistorico.value.trim().toLowerCase();
            const itens = listaHistorico.querySelectorAll('.historico-item');
            
            itens.forEach(el => {
                const texto = el.innerText.toLowerCase();
                if (!termo || texto.includes(termo)) {
                    el.style.display = 'flex';
                } else {
                    el.style.display = 'none';
                }
            });
        }

        campoBuscaHistorico.addEventListener('input', filtrarListaHistorico);

        btnLimparBusca.addEventListener('click', () => {
            campoBuscaHistorico.value = '';
            filtrarListaHistorico();
            campoBuscaHistorico.focus();
        });

        socket.on('mostrar-dados', (dados) => {
            if (dadosAnteriores) {
                const itemHist = document.createElement('div');
                itemHist.className = 'historico-item';

                const n = dadosAnteriores.nome ? dadosAnteriores.nome.toUpperCase() : "SEM NOME";
                const detalhesTexto = `(Vol: ${dadosAnteriores.volumesTotal} | Peso: ${dadosAnteriores.pesoTotalGeral})`;
                
                const textoSenhasCompleto = dadosAnteriores.itens.map(i => {
                    return `${i.senha} [${i.tipo.toUpperCase()}-${i.status}] (OBS:${i.obs})`;
                }).join(' | ');

                itemHist.innerHTML = `
                    <div class="hist-cliente-box">
                        <span class="hist-nome">${n}</span> 
                        <span class="hist-info">${detalhesTexto}</span>
                    </div>
                    <span class="hist-senhas">${textoSenhasCompleto}</span>
                    <span class="hist-status-tag hist-status-amarelo" onclick="alternarStatusHistorico(this)">● Aguardando</span>
                `;

                listaHistorico.insertBefore(itemHist, listaHistorico.firstChild);

                if (listaHistorico.children.length > 8) {
                    listaHistorico.removeChild(listaHistorico.lastChild);
                }

                // Reaplica o filtro atual caso haja termo digitado
                filtrarListaHistorico();
            }

            txtNome.innerText = dados.nome.length > 0 ? dados.nome.toUpperCase() : "---";
            txtVolumesTotal.innerText = dados.volumesTotal;
            txtPesoTotal.innerText = dados.pesoTotalGeral;
            
            containerVisualSenhas.innerHTML = "";
            dados.itens.forEach(item => {
                const caixaBloco = document.createElement('div');
                caixaBloco.className = 'bloco-senha-completo';
                const classeStatus = item.status === "Completo" ? "status-completo" : "status-parcial";

                caixaBloco.innerHTML = `
                    <div class="senha-codigo">${item.senha}</div>
                    <div class="senha-tipo-info">${item.tipo}</div>
                    <div class="senha-detalhes-linha">${item.volume} Vol. | ${item.pesoExibição}</div>
                    <div><span class="status-badge ${classeStatus}">${item.status}</span></div>
                    <div class="senha-obs-linha">OBS: ${item.obs}</div>
                `;

                containerVisualSenhas.appendChild(caixaBloco);
            });

            dadosAnteriores = dados;

            tocarBip();
            document.body.classList.add('alerta-visual');
            setTimeout(() => { document.body.classList.remove('alerta-visual'); }, 300);
        });
    </script>
</body>
</html>
